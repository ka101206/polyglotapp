name: polyglot-spark

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: polyglot-spark-db
    environment:
      POSTGRES_USER: ${POLYGLOT_DB_USER:-polyglot}
      POSTGRES_PASSWORD: ${POLYGLOT_DB_PASSWORD:?Set POLYGLOT_DB_PASSWORD in .env}
      POSTGRES_DB: ${POLYGLOT_DB_NAME:-polyglot}
    volumes:
      - polyglot_spark_pgdata:/var/lib/postgresql/data
    networks:
      - polyglot-spark
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        # Optional: pass a HuggingFace token to speed up the build-time model
        # download and avoid anonymous rate limits. Anonymous works too.
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: polyglot-spark-backend
    environment:
      DATABASE_URL: postgresql://${POLYGLOT_DB_USER:-polyglot}:${POLYGLOT_DB_PASSWORD:?Set POLYGLOT_DB_PASSWORD in .env}@db:5432/${POLYGLOT_DB_NAME:-polyglot}
      VLLM_URL: ${POLYGLOT_VLLM_URL:-http://host.docker.internal:8000/v1}
      AI_MODEL: ${POLYGLOT_AI_MODEL:-qwen2.5-7b-fp8}
      OPENAI_API_KEY: ${POLYGLOT_OPENAI_API_KEY:-token-nv}
    ports:
      - "${POLYGLOT_BACKEND_PORT:-18082}:8081"
    # TTS models are baked into the image (see backend.Dockerfile), so no
    # model volume is mounted here — an empty volume would shadow them.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - polyglot-spark
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: polyglot-spark-frontend
    environment:
      VITE_API_URL: ${POLYGLOT_PUBLIC_API_URL:-http://10.74.10.244:18082}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - polyglot-spark
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: polyglot-spark-proxy
    ports:
      - "${POLYGLOT_FRONTEND_PORT:-18084}:80"
      - "${POLYGLOT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-selfsigned.crt:/etc/nginx/certs/server.crt:ro
      - ./nginx-selfsigned.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - frontend
      - backend
    networks:
      - polyglot-spark
    restart: unless-stopped





networks:
  polyglot-spark:
    name: polyglot-spark

volumes:
  polyglot_spark_pgdata:
    name: aboveavg_polyglot_spark_pgdata
